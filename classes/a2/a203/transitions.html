<!DOCTYPE html>

<html>

<head>
  <style>
    #ball {
      background-color: red;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      transition: background-color 4s;
    }

    #ball.green {
      background-color: green;
    }

    #ball:hover {
      background-color: lightblue;
    }
  </style>
</head>

<body>
  <button
    onclick="document.querySelector('#ball').classList.toggle('green');">Switch</button>
  <div id="ball"></div>
</body>

</html>
